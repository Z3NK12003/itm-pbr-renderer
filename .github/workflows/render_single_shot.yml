name: Render Single PBR Shot (1080p)

on:
  workflow_dispatch:
    inputs:
      episode:
        description: 'Episode ID'
        required: true
        default: 'ep05'
        type: choice
        options:
          - ep03
          - ep04
          - ep05
          - ep06
          - ep07
          - ep08
          - ep09
          - ep10
      act:
        description: 'Act number (1-5)'
        required: true
        default: '1'
        type: choice
        options: ['1', '2', '3', '4', '5']
      shot:
        description: 'Shot number (1-3)'
        required: true
        default: '1'
        type: choice
        options: ['1', '2', '3']
      chunk:
        description: 'Frame chunk (1 = frames 1-48, 2 = 49-96, 3 = 97-144)'
        required: true
        default: '1'
        type: choice
        options: ['1', '2', '3']
      samples:
        description: 'Cycles max samples (adaptive sampling, threshold 0.04)'
        required: true
        default: '48'
        type: choice
        options: ['32', '48', '64']
      resolution:
        description: 'Render resolution'
        required: true
        default: '1080p'
        type: choice
        options: ['1080p', '720p']

jobs:
  render_shot:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Blender 4.2.3 LTS
        id: cache-blender
        uses: actions/cache@v4
        with:
          path: /opt/blender-4.2.3
          key: blender-4.2.3-linux-x64-v2

      - name: Install Blender 4.2.3 LTS (Auto-Retry)
        if: steps.cache-blender.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libxrender1 libxi6 libxkbcommon0 libsm6 libgl1 libglu1-mesa xz-utils
          wget --tries=5 --waitretry=5 --retry-connrefused --timeout=60 -q \
            https://download.blender.org/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz -O /tmp/blender.tar.xz
          sudo mkdir -p /opt/blender-4.2.3
          sudo tar -xf /tmp/blender.tar.xz -C /opt/blender-4.2.3 --strip-components=1
          rm -f /tmp/blender.tar.xz
          /opt/blender-4.2.3/blender --version

      - name: Install Runtime Libs & FFmpeg (Cached)
        if: steps.cache-blender.outputs.cache-hit == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libxrender1 libxi6 libxkbcommon0 libsm6 libgl1 libglu1-mesa

      - name: Check FFmpeg filters (CAS sharpening)
        run: |
          if ffmpeg -hide_banner -filters 2>/dev/null | grep -qw cas; then echo "CAS filter: available"; else echo "CAS filter: MISSING (assembly will run with --no-cas)"; fi

      - name: Render 48-Frame Chunk (${{ inputs.episode }} A${{ inputs.act }} S${{ inputs.shot }} C${{ inputs.chunk }})
        run: |
          mkdir -p build/frames build/clips
          if [ "${{ inputs.resolution }}" = "720p" ]; then W=1280; H=720; else W=1920; H=1080; fi
          FS=$(( (${{ inputs.chunk }} - 1) * 48 + 1 ))
          FE=$(( ${{ inputs.chunk }} * 48 ))
          /opt/blender-4.2.3/blender -b --python-exit-code 1 \
            --python scripts/blender_render_episode.py -- \
            --episode ${{ inputs.episode }} \
            --act ${{ inputs.act }} \
            --shot ${{ inputs.shot }} \
            --frames 144 \
            --frame-start $FS \
            --frame-end $FE \
            --fps 24 \
            --samples ${{ inputs.samples }} \
            --width $W --height $H \
            --device CPU \
            --out build/frames
          ffmpeg -y -framerate 24 -start_number $FS -i build/frames/frame_%04d.png \
            -c:v libx264 -preset fast -crf 17 -pix_fmt yuv420p -movflags +faststart \
            build/clips/act_${{ inputs.act }}_shot_${{ inputs.shot }}_chunk_${{ inputs.chunk }}.mp4

      - name: Upload Single Chunk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.episode }}-pbr-clip-a${{ inputs.act }}-s${{ inputs.shot }}-c${{ inputs.chunk }}
          path: build/clips/act_${{ inputs.act }}_shot_${{ inputs.shot }}_chunk_${{ inputs.chunk }}.mp4
          if-no-files-found: error
          retention-days: 14
